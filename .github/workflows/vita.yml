name: Vita compile check
on:
  push:
    paths: ['platform/vita/**', 'src/**', 'cmake/**', 'scripts/setup.py', 'scripts/build_vita.py', 'scripts/games.py', 'tests/vita/**', 'tests/scripts/test_build_vita.py', 'CMakeLists.txt', '.github/workflows/vita.yml']
  pull_request:
    paths: ['platform/vita/**', 'src/**', 'cmake/**', 'scripts/setup.py', 'scripts/build_vita.py', 'scripts/games.py', 'tests/vita/**', 'tests/scripts/test_build_vita.py', 'CMakeLists.txt', '.github/workflows/vita.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch the pinned dependencies of the root build
        run: python3 scripts/setup.py --no-build
      - name: Vita host tests (platform/vita code against host mocks)
        run: |
          cmake -S . -B build/vita-tests -DM2_VITA_TESTS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build/vita-tests --parallel 4
          ctest --test-dir build/vita-tests -R vita --output-on-failure
          python3 -m unittest discover -s tests/scripts -p 'test_*vita*.py' -v
  arm-compile:
    runs-on: ubuntu-24.04
    container: vitasdk/vitasdk:2026.08-20260815
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Host tools
        run: |
          apt-get update
          apt-get install -y git python3 cmake make g++
      - name: Fetch the existing pinned runtime dependencies
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import sys
          sys.path.insert(0, "scripts")
          import setup
          os.makedirs(setup.EXTERN, exist_ok=True)
          setup.fetch(*setup.SOFTFLOAT, "softfloat")
          setup.fetch(*setup.YMFM, "ymfm")
          PY
      - name: Compile the ARM runtime and Vita frontend without ROM data
        run: python3 scripts/build_vita.py --compile-check --jobs 2
      # Deliberately no game-code stubs, ROM secrets, VPK or artifact upload.
      # This job checks ARM compilation, not final linking or gameplay.
